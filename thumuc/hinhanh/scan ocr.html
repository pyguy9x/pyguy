<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quét Tài Liệu OCR - Gemini 2.5 Flash (OpenRouter)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-t-screen p-4 sm:p-6">

    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Quét Tài Liệu AI</h1>
            <p class="text-blue-100 text-sm mt-1">Sức mạnh từ Gemini 2.5 Flash qua OpenRouter</p>
        </div>

        <div class="p-6 space-y-5">
            <!-- Cấu hình API Key -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">OpenRouter API Key:</label>
                <input type="password" id="apiKey" placeholder="sk-or-v1-..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                <p class="text-xs text-slate-400 mt-1">Key được lưu an toàn trên trình duyệt của riêng bạn.</p>
            </div>

            <!-- Khu vực chụp ảnh / chọn ảnh -->
            <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:border-blue-400 transition bg-slate-50">
                <input type="file" id="imageInput" accept="image/*" capture="environment" class="hidden">
                <label for="imageInput" class="cursor-pointer flex flex-col items-center justify-center space-y-2">
                    <svg class="w-12 h-12 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812-1.22A2 2 0 0118.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span class="text-sm font-medium text-blue-600">Chạm để mở Camera / Chọn ảnh tài liệu</span>
                    <span class="text-xs text-slate-400">Hỗ trợ JPG, PNG, WEBP</span>
                </label>
            </div>

            <!-- Xem trước ảnh -->
            <div id="previewContainer" class="hidden relative rounded-xl overflow-hidden border bg-black/5 max-h-60 flex justify-center">
                <img id="imagePreview" class="max-h-60 object-contain">
            </div>

            <!-- Nút hành động -->
            <button id="scanBtn" onclick="processOCR()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-500/20 disabled:opacity-50">
                Bắt đầu quét văn bản (AI)
            </button>

            <!-- Trạng thái chờ -->
            <div id="loading" class="hidden text-center text-blue-600 font-medium animate-pulse text-sm">
                AI đang đọc tài liệu, vui lòng đợi trong giây lát...
            </div>

            <!-- Kết quả -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="block text-sm font-semibold text-slate-700">Kết quả trích xuất:</label>
                    <div class="space-x-2">
                        <button onclick="copyText()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1 rounded transition">Sao chép</button>
                        <button onclick="downloadTxt()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1 rounded transition">Tải TXT</button>
                    </div>
                </div>
                <textarea id="resultText" rows="6" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-slate-50 font-mono" placeholder="Văn bản sau khi quét sẽ hiện ở đây..."></textarea>
            </div>
        </div>
    </div>

    <script>
        let base64Image = null;

        // Lưu và khôi phục API Key từ localStorage để đỡ phải nhập lại nhiều lần
        const apiKeyInput = document.getElementById('apiKey');
        const savedKey = localStorage.getItem('openrouter_api_key');
        if (savedKey) apiKeyInput.value = savedKey;

        apiKeyInput.addEventListener('input', (e) => {
            localStorage.setItem('openrouter_api_key', e.target.value.trim());
        });

        // Xử lý khi chọn ảnh
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                base64Image = uploadEvent.target.result;
                document.getElementById('imagePreview').src = base64Image;
                document.getElementById('previewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        });

        // Gửi ảnh lên OpenRouter gọi Gemini 2.5 Flash
        async function processOCR() {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert('Vui lòng nhập OpenRouter API Key trước!');
                return;
            }
            if (!base64Image) {
                alert('Vui lòng chụp hoặc chọn ảnh tài liệu trước!');
                return;
            }

            const loading = document.getElementById('loading');
            const scanBtn = document.getElementById('scanBtn');
            const resultText = document.getElementById('resultText');

            loading.classList.remove('hidden');
            scanBtn.disabled = true;
            resultText.value = '';

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.href, // Tùy chọn bắt buộc của OpenRouter
                        "X-Title": "Web OCR App"
                    },
                    body: JSON.stringify({
                        "model": "google/gemini-2.5-flash",
                        "messages": [
                            {
                                "role": "user",
                                "content": [
                                    {
                                        "type": "text",
                                        "text": "Hãy đọc và trích xuất toàn bộ văn bản có trong hình ảnh này một cách chính xác nhất. Giữ nguyên định dạng hoặc xuống dòng nếu có. Chỉ trả về nội dung văn bản được trích xuất, không kèm theo lời chào hay giải thích gì thêm."
                                    },
                                    {
                                        "type": "image_url",
                                        "image_url": {
                                            "url": base64Image
                                        }
                                    }
                                ]
                            }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || JSON.stringify(data.error));
                }

                const textOutput = data.choices[0].message.content;
                resultText.value = textOutput;

            } catch (error) {
                alert('Lỗi: ' + error.message);
            } finally {
                loading.classList.add('hidden');
                scanBtn.disabled = false;
            }
        }

        // Tiện ích sao chép
        function copyText() {
            const text = document.getElementById('resultText');
            text.select();
            navigator.clipboard.writeText(text.value);
            alert('Đã sao chép văn bản vào bộ nhớ tạm!');
        }

        // Tiện ích tải file txt
        function downloadTxt() {
            const text = document.getElementById('resultText').value;
            if (!text) {
                alert('Không có nội dung để tải xuống!');
                return;
            }
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ket-qua-ocr.txt';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
